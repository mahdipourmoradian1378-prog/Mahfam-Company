<style>
  :root {
    --navy: #0a1840;
    --navy-deep: #050b1f;
    --gold: #d9b660;
    --ink: #eef1fa;
    --panel: rgba(8, 20, 56, .97);
    --line: rgba(217, 182, 96, .35);
    --flip: .9s;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    height: 100dvh;
    font-family: Vazirmatn, Tahoma, "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(ellipse at 50% 40%, #12275f 0%, var(--navy) 45%, var(--navy-deep) 100%);
    overflow: hidden;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  header {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
    gap: .6rem; height: 46px; font-size: .95rem; letter-spacing: .02em;
  }
  header b { font-weight: 600; color: var(--gold); }
  header span { opacity: .7; font-weight: 300; direction: ltr; }

  #stage {
    position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden;
    touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: pointer;
  }
  #stage.zoomed { cursor: grab; touch-action: none; }
  #stage.zoomed.dragging { cursor: grabbing; }
  #zoom { position: absolute; inset: 0; transform-origin: 50% 50%; transition: transform .35s ease; }
  #zoom.nodrag { transition: none; }

  #book {
    position: absolute; left: 50%; top: 50%;
    perspective: 2800px;
    transition: transform var(--flip) cubic-bezier(.45,.05,.25,1);
  }
  .leaf {
    position: absolute; left: 0; top: 0;
    width: var(--p); height: var(--p);
    transform-origin: right center;
    transform-style: preserve-3d;
    transition: transform var(--flip) cubic-bezier(.45,.05,.25,1);
  }
  .leaf.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; overflow: hidden;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--navy);
    box-shadow: 0 4px 18px rgba(0,0,0,.25);
  }
  .face.back { transform: rotateY(180deg); }
  .face img { width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
  .face::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
  .face.front::after { background: linear-gradient(to left, rgba(0,0,0,.28), rgba(0,0,0,0) 9%); }
  .face.back::after  { background: linear-gradient(to right, rgba(0,0,0,.28), rgba(0,0,0,0) 9%); }
  .face.blank { background: linear-gradient(135deg, #0d1d4d, var(--navy)); }
  body.single .face::after { display: none; }
  body.single .face { box-shadow: none; }

  /* phone mode: plain 2D slide, no 3D layers */
  .sp {
    position: absolute; left: 0; top: 0; width: var(--p); height: var(--p);
    background: var(--navy); overflow: hidden; will-change: transform;
    box-shadow: 0 0 22px rgba(0,0,0,.35);
    transition: transform .38s cubic-bezier(.3,.1,.2,1);
  }
  .sp { background-size: cover; background-position: center; }
  .sp img { opacity: 0; transition: opacity .25s ease; }
  .sp img.ok { opacity: 1; }
  .sp.gone { transform: translate3d(104%, 0, 0); }
  .sp.now  { transform: translate3d(0, 0, 0); }
  .sp.instant { transition: none; }
  .sp img { width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
  body.single #book { perspective: none; }

  /* toolbar */
  #bar {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
    gap: .5rem; padding: .55rem .75rem .7rem; position: relative; z-index: 5;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
    height: 42px; min-width: 42px; padding: 0 .8rem;
    border: 1px solid var(--line); border-radius: 999px;
    background: rgba(255,255,255,.05); color: var(--ink);
    font: inherit; font-size: .85rem; cursor: pointer; text-decoration: none;
    transition: background .2s, border-color .2s, opacity .2s;
  }
  .btn:hover { background: rgba(217,182,96,.18); border-color: var(--gold); }
  .btn:disabled { opacity: .3; cursor: default; pointer-events: none; }
  .btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn.on { background: rgba(217,182,96,.25); border-color: var(--gold); }
  #indicator { min-width: 92px; text-align: center; font-size: .95rem; font-variant-numeric: tabular-nums; }
  .spacer { width: .4rem; }

  /* table of contents */
  #toc {
    position: absolute; bottom: 70px; right: .75rem; z-index: 20;
    width: min(320px, calc(100vw - 1.5rem)); max-height: min(70vh, 480px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    padding: .5rem; display: none;
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  #toc.open { display: block; }
  #toc button {
    display: flex; width: 100%; align-items: center; gap: .7rem; text-align: right;
    padding: .6rem .7rem; border: 0; border-radius: 12px; background: transparent;
    color: var(--ink); font: inherit; cursor: pointer;
  }
  #toc button:hover, #toc button.active { background: rgba(217,182,96,.18); }
  #toc .num { color: var(--gold); font-weight: 600; min-width: 1.8rem; }
  #toc .t { display: flex; flex-direction: column; line-height: 1.35; }
  #toc .t small { opacity: .6; direction: ltr; text-align: right; font-weight: 300; }
  #toc .pg { margin-inline-start: auto; opacity: .5; font-size: .8rem; }

  noscript { position: absolute; inset: 0; display: grid; place-items: center; z-index: 50; background: var(--navy); }
  noscript a { color: var(--gold); }

  @media (max-width: 560px) {
    .btn .lbl { display: none; }
    .btn { padding: 0 .65rem; }
    #bar { gap: .35rem; }
    #indicator { min-width: 70px; font-size: .9rem; }
    header { height: 38px; font-size: .85rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --flip: .01s; }
    #zoom { transition: none; }
  }
</style>

  var AVIF_PROBE = "data:image/avif;base64,AAAAIGZ0eXBhdmlmAAAAAGF2aWZtaWYxbWlhZk1BMUIAAADrbWV0YQAAAAAAAAAhaGRscgAAAAAAAAAAcGljdAAAAAAAAAAAAAAAAAAAAAAOcGl0bQAAAAAAAQAAAB5pbG9jAAAAAEQAAAEAAQAAAAEAAAETAAAAGAAAAChpaW5mAAAAAAABAAAAGmluZmUCAAAAAAEAAGF2MDFDb2xvcgAAAABqaXBycAAAAEtpcGNvAAAAFGlzcGUAAAAAAAAAAgAAAAIAAAAQcGl4aQAAAAADCAgIAAAADGF2MUOBAAwAAAAAE2NvbHJuY2x4AAEADQAGgAAAABdpcG1hAAAAAAAAAAEAAQQBAoMEAAAAIG1kYXQSAAoFGAA2BCAyDRsAGmmmhAAAsBNWXIw=";
  var SMALL = function (n) { return "pages-m/p-" + (n < 10 ? "0" + n : n) + "." + EXT; };
  function srcFor(n) { return (single && zoom <= 1) ? SMALL(n) : FILE(n); }

  function makeFace(cls, page) {
    var d = document.createElement("div");
    d.className = "face " + cls + (page ? "" : " blank");
    if (page) {
      var img = document.createElement("img");
      img.alt = "صفحه " + fa(page);
      img.decoding = "async";
      img.draggable = false;
      img.dataset.page = page;
      d.appendChild(img);
    }
    return d;
  }

  function build() {
    book.innerHTML = "";
    leaves = [];
    spEls = {};
    if (single) return;                      // phone mode mounts pages on demand
    for (var i = 0; i < TOTAL / 2; i++) {
      var leaf = document.createElement("div");
      leaf.className = "leaf";
      leaf.appendChild(makeFace("front", 2 * i + 1));
      leaf.appendChild(makeFace("back", 2 * i + 2));
      book.appendChild(leaf);
      leaves.push(leaf);
    }
  }

  /* ---------- layout ---------- */
  function layout() {
    var r = stage.getBoundingClientRect();
    var w = r.width, h = r.height;
    var wantSingle = (w < 820) || (w / h < 1.3);
    if (wantSingle !== single || !built) {
      var vis = built ? visiblePages()[0] : 1;
      single = wantSingle;
      built = true;
      document.body.classList.toggle("single", single);
      cur = single ? vis - 1 : Math.floor(vis / 2);
      prevCur = null;
      build();
      applyState(true);
    }
    P = Math.floor(single ? Math.min(w * 0.98, h * 0.97) : Math.min(w / 2 * 0.97, h * 0.97));
    book.style.setProperty("--p", P + "px");
    book.style.width = (single ? P : P * 2) + "px";
    book.style.height = P + "px";
    positionBook();
    clampPan(); applyZoom(true);
  }

  function positionBook() {
    var bw = single ? P : P * 2;
    var shift = 0;
    if (!single) {
      if (cur === 0) shift = P / 2;                  // closed cover sits on the left half: centre it
      else if (cur === TOTAL / 2) shift = -P / 2;    // back cover sits on the right half
    }
    book.style.transform = "translate(" + (-bw / 2 + shift) + "px," + (-P / 2) + "px)";
  }

  /* ---------- state -> DOM ---------- */
  var prevCur = null, zTimer = null;

  function applyState(instant) {
    if (single) applySingle(instant); else applyDouble(instant);
    prevCur = cur;
    positionBook();
    updateUI();
    if (started) pump();
  }

  /* desktop / tablet: 3D book */
  function applyDouble(instant) {
    var n = leaves.length;
    var from = prevCur === null ? cur : prevCur;
    var lo = Math.min(from, cur), hi = Math.max(from, cur);
    var forward = cur >= from;
    var k = 0;
    for (var j = 0; j < n; j++) {
      var i = forward ? j : n - 1 - j;
      var el = leaves[i];
      var flipped = i < cur;
      var moving = !instant && i >= lo && i < hi;
      el.style.transitionDelay = moving ? Math.min(k * 70, 420) + "ms" : "0ms";
      if (instant) el.style.transition = "none";
      el.classList.toggle("flipped", flipped);
      el.style.zIndex = moving ? 100 + k : (flipped ? i + 1 : n - i);
      if (moving) k++;
    }
    if (instant) { void book.offsetWidth; leaves.forEach(function (el) { el.style.transition = ""; }); }
    clearTimeout(zTimer);
    zTimer = setTimeout(function () {
      leaves.forEach(function (el, i) { el.style.zIndex = (i < cur) ? i + 1 : leaves.length - i; });
    }, instant ? 0 : 1500);
    loadDouble();
  }

  /* load nearby images, free far-away ones (keeps memory low) */
  function loadDouble() {
    var v = visiblePages();
    var lo = Math.max(1, v[0] - 4), hi = Math.min(TOTAL, v[v.length - 1] + 5);
    var imgs = book.querySelectorAll("img");
    for (var i = 0; i < imgs.length; i++) {
      var p = +imgs[i].dataset.page, has = imgs[i].getAttribute("src");
      if (p >= lo && p <= hi) { if (!has) imgs[i].src = FILE(p); }
      else if (has && (p < lo - 5 || p > hi + 5)) imgs[i].removeAttribute("src");
    }
  }

  /* phone: only ~5 flat pages exist at any time */
  var spEls = {};
  function mountSingle(i, instant) {
    var el = spEls[i];
    if (el) return el;
    el = document.createElement("div");
    el.className = "sp " + (i < cur ? "gone" : "now") + (instant ? " instant" : "");
    el.style.backgroundImage = "url(" + LQ[i] + ")";
    var img = document.createElement("img");
    img.alt = "صفحه " + fa(i + 1);
    img.decoding = "async";
    img.draggable = false;
    img.dataset.page = i + 1;
    img.onload = function () { img.classList.add("ok"); };
    img.onerror = function () {                       // AVIF failed? retry once as WebP
      if (EXT === "avif" && /\.avif$/.test(img.getAttribute("src") || "")) {
        EXT = "webp"; img.src = SMALL(i + 1);
      }
    };
    el.appendChild(img);
    book.appendChild(el);
    spEls[i] = el;
    return el;
  }
  function applySingle(instant) {
    var lo = Math.max(0, cur - 2), hi = Math.min(TOTAL - 1, cur + 3);
    Object.keys(spEls).forEach(function (k) {
      if (k < lo || k > hi) { var im = spEls[k].firstChild; im.removeAttribute("src"); spEls[k].remove(); delete spEls[k]; }
    });
    for (var i = lo; i <= hi; i++) {
      var el = mountSingle(i, true);
      var img = el.firstChild;
      var want = srcFor(i + 1);
      if (img.getAttribute("src") !== want && (i >= cur - 1 && i <= cur + 2)) img.src = want;
      if (instant || el.classList.contains("instant")) el.classList.add("instant");
      el.classList.toggle("gone", i < cur);
      el.classList.toggle("now", i >= cur);
      el.style.zIndex = i < cur ? i + 1 : TOTAL - i;
    }
    if (!instant) {
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        Object.keys(spEls).forEach(function (k) { spEls[k].classList.remove("instant"); });
      }); });
    } else {
      setTimeout(function () { Object.keys(spEls).forEach(function (k) { spEls[k].classList.remove("instant"); }); }, 60);
    }
  }

  function updateUI() {
    var v = visiblePages();
    indicator.textContent = v.length === 2
      ? fa(v[0]) + "–" + fa(v[1]) + " / " + fa(TOTAL)
      : fa(v[0]) + " / " + fa(TOTAL);
    btnPrev.disabled = cur <= 0;
    btnNext.disabled = cur >= maxCur();
    var cp = v[0], maxV = v[v.length - 1];
    Array.prototype.forEach.call(toc.querySelectorAll("button"), function (b) {
      var p = +b.dataset.page, next = null;
      for (var i = 0; i < TOC.length; i++) { if (TOC[i][0] > p) { next = TOC[i][0]; break; } }
      b.classList.toggle("active", maxV >= p && (next === null || cp < next));
    });
  }

  /* ---------- navigation ---------- */
  function setCur(c) {
    c = Math.max(0, Math.min(maxCur(), c));
    if (c === cur) return;
    var jump = Math.abs(c - cur) > 1 && single;
    cur = c;
    applyState(jump);
  }
  function next() { setCur(cur + 1); }
  function prev() { setCur(cur - 1); }
  function goTo(page) {
    page = Math.max(1, Math.min(TOTAL, page));
    setCur(single ? page - 1 : Math.floor(page / 2));
  }

  /* ---------- zoom / pan ---------- */
  function clampPan() {
    var r = stage.getBoundingClientRect();
    var mx = Math.max(0, (zoom - 1) * r.width / 2), my = Math.max(0, (zoom - 1) * r.height / 2);
    panX = Math.max(-mx, Math.min(mx, panX));
    panY = Math.max(-my, Math.min(my, panY));
  }
  function applyZoom(noAnim) {
    zoomEl.classList.toggle("nodrag", !!noAnim);
    zoomEl.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + zoom + ")";
    stage.classList.toggle("zoomed", zoom > 1);
    btnZoom.classList.toggle("on", zoom > 1);
    if (single && built) {                        // sharper image while zoomed in
      [cur - 1, cur].forEach(function (i) {
        var el = spEls[i]; if (!el) return;
        var want = srcFor(i + 1);
        if (el.firstChild.getAttribute("src") !== want) el.firstChild.src = want;
      });
    }
  }
  function toggleZoom() {
    zoom = zoom > 1 ? 1 : 2.2;
    panX = panY = 0;
    applyZoom(false);
  }

  /* ---------- pointer: tap, swipe, pan ---------- */
  var down = null;
  stage.addEventListener("pointerdown", function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    down = { x: e.clientX, y: e.clientY, px: panX, py: panY, moved: false };
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  });
  stage.addEventListener("pointermove", function (e) {
    if (!down) return;
    var dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) down.moved = true;
    if (zoom > 1 && down.moved) {
      stage.classList.add("dragging");
      panX = down.px + dx; panY = down.py + dy;
      clampPan(); applyZoom(true);
    }
  });
  function endPointer(e) {
    if (!down) return;
    var d = down; down = null;
    stage.classList.remove("dragging");
    if (zoom > 1) return;
    var dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      dx > 0 ? next() : prev();                 // RTL: drag to the right = next page
    } else if (!d.moved) {
      var r = stage.getBoundingClientRect();
      (e.clientX - r.left) < r.width / 2 ? next() : prev();   // left half = next, right half = back
    }
  }
  stage.addEventListener("pointerup", endPointer);
  stage.addEventListener("pointercancel", function () { down = null; stage.classList.remove("dragging"); });

  /* ---------- buttons, keyboard ---------- */
  btnNext.addEventListener("click", next);
  btnPrev.addEventListener("click", prev);
  btnZoom.addEventListener("click", toggleZoom);
  if (document.documentElement.requestFullscreen) {
    btnFull.addEventListener("click", function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    });
  } else { btnFull.style.display = "none"; }

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft")  { e.preventDefault(); next(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); prev(); }
    else if (e.key === "Home") { goTo(1); }
    else if (e.key === "End")  { goTo(TOTAL); }
    else if (e.key === "Escape") { toc.classList.remove("open"); }
    else if (e.key === "+" || e.key === "=" || e.key === "-") { toggleZoom(); }
  });

  /* ---------- table of contents ---------- */
  TOC.forEach(function (it) {
    var b = document.createElement("button");
    b.dataset.page = it[0];
    b.innerHTML = '<span class="num">' + (it[3] ? it[3].replace(/\d/g, function (d) { return fa(d); }) : "•") + '</span>' +
                  '<span class="t">' + it[1] + '<small>' + it[2] + '</small></span>' +
                  '<span class="pg">' + fa(it[0]) + '</span>';
    b.addEventListener("click", function () { goTo(it[0]); toc.classList.remove("open"); btnToc.classList.remove("on"); });
    toc.appendChild(b);
  });
  btnToc.addEventListener("click", function (e) {
    e.stopPropagation();
    var open = toc.classList.toggle("open");
    btnToc.classList.toggle("on", open);
  });
  document.addEventListener("click", function (e) {
    if (!toc.contains(e.target) && e.target !== btnToc && !btnToc.contains(e.target)) {
      toc.classList.remove("open"); btnToc.classList.remove("on");
    }
  });

  /* ---------- start ---------- */
  var rt;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(layout, 120); });
  window.addEventListener("orientationchange", function () { setTimeout(layout, 250); });
  /* ---------- background prefetch: quietly download the rest on phones ---------- */
  var fetched = {}, inflight = 0, started = false;
  function pump() {
    if (!single) return;
    var c = navigator.connection;
    if (c && (c.saveData || /(^|-)2g$/.test(c.effectiveType || ""))) return;   // respect data saver
    while (inflight < 2) {
      var best = 0, bd = 1e9, i;
      for (i = 1; i <= TOTAL; i++) {
        if (fetched[i]) continue;
        var d = (i - 1 >= cur ? (i - 1 - cur) : (cur - (i - 1)) * 3);       // pages ahead first
        if (d < bd) { bd = d; best = i; }
      }
      if (!best) return;
      fetched[best] = 1; inflight++;
      (function (n) {
        var im = new Image();
        im.onload = im.onerror = function () { inflight--; setTimeout(pump, 40); };
        im.src = SMALL(n);
      })(best);
    }
  }
  function startPrefetch() {
    if (started) return; started = true;
    var go = function () { pump(); };
    if (window.requestIdleCallback) requestIdleCallback(go, { timeout: 1500 }); else setTimeout(go, 800);
  }

  function detectAvif(cb) {
    var t = new Image(), done = false;
    var fin = function (ok) { if (!done) { done = true; cb(ok); } };
    t.onload = function () { fin(t.width > 0); };
    t.onerror = function () { fin(false); };
    t.src = AVIF_PROBE;
    setTimeout(function () { fin(false); }, 400);
  }

  detectAvif(function (ok) {
    EXT = ok ? "avif" : "webp";
    layout();
    startPrefetch();
  });
})();
</script>
</body>
</html>
