<style>
  @font-face { font-family: "Open Sans UI"; font-weight: 500; font-style: normal; font-display: swap;
    src: url("fonts/OpenSans-Medium.woff") format("woff"); }
  @font-face { font-family: "Open Sans UI"; font-weight: 300; font-style: normal; font-display: swap;
    src: url("fonts/OpenSans-Light.woff") format("woff"); }
  @font-face { font-family: "Yekan Bakh UI"; font-weight: 400; font-style: normal; font-display: swap;
    src: url("fonts/YekanBakhFaNum-Regular.woff") format("woff"); }

  :root {
    --font-en-medium: "Open Sans UI", "Segoe UI", system-ui, sans-serif;   /* Open Sans Medium (500) / Light (300) */
    --font-fa: "Yekan Bakh UI", Vazirmatn, Tahoma, "Segoe UI", system-ui, sans-serif;
    --navy: #0a1840;
    --navy-deep: #050b1f;
    --gold: #d9b660;
    --ink: #eef1fa;
    --panel: rgba(8, 20, 56, .97);
    --line: rgba(217, 182, 96, .35);
    --flip: .9s;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    height: 100dvh;
    font-family: var(--font-fa);          /* Persian text: Yekan Bakh */
    font-weight: 400;
    color: var(--ink);
    background: radial-gradient(ellipse at 50% 40%, #12275f 0%, var(--navy) 45%, var(--navy-deep) 100%);
    overflow: hidden;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  header {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
    gap: .6rem; height: 46px; font-size: .95rem; letter-spacing: .02em;
  }
  header span { opacity: .7; font-family: var(--font-en-medium); font-weight: 300; direction: ltr; }
  header span b { font-weight: 500; }

  #stage {
    position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden;
    touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: pointer;
  }
  #stage.zoomed { cursor: grab; touch-action: none; }
  #stage.zoomed.dragging { cursor: grabbing; }
  #zoom { position: absolute; inset: 0; transform-origin: 50% 50%; transition: transform .35s ease; }
  #zoom.nodrag { transition: none; }

  #book {
    position: absolute; left: 50%; top: 50%;
    perspective: 2800px;
    transition: transform var(--flip) cubic-bezier(.45,.05,.25,1);
  }
  .leaf {
    position: absolute; left: 0; top: 0;
    width: var(--p); height: var(--p);
    transform-origin: right center;
    transform-style: preserve-3d;
    transition: transform var(--flip) cubic-bezier(.45,.05,.25,1);
  }
  .leaf.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; overflow: hidden;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--navy);
    box-shadow: 0 4px 18px rgba(0,0,0,.25);
  }
  .face.back { transform: rotateY(180deg); }
  .face img { width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
  .face::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
  .face.front::after { background: linear-gradient(to left, rgba(0,0,0,.28), rgba(0,0,0,0) 9%); }
  .face.back::after  { background: linear-gradient(to right, rgba(0,0,0,.28), rgba(0,0,0,0) 9%); }
  .face.blank { background: linear-gradient(135deg, #0d1d4d, var(--navy)); }
  body.single .face::after { display: none; }
  body.single .face { box-shadow: none; }

  /* phone mode: plain 2D slide, no 3D layers */
  .sp {
    position: absolute; left: 0; top: 0; width: var(--p); height: var(--p);
    background: var(--navy); overflow: hidden; will-change: transform;
    box-shadow: 0 0 22px rgba(0,0,0,.35);
    transition: transform .38s cubic-bezier(.3,.1,.2,1);
  }
  .sp img { opacity: 0; transition: opacity .25s ease; }
  .sp img.ok { opacity: 1; }
  .sp.gone { transform: translate3d(104%, 0, 0); }
  .sp.now  { transform: translate3d(0, 0, 0); }
  .sp.instant { transition: none; }
  .sp img { width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
  body.single #book { perspective: none; }

  #spin { position: absolute; left: 50%; top: 50%; width: 38px; height: 38px; margin: -19px 0 0 -19px;
    border: 3px solid rgba(217,182,96,.25); border-top-color: var(--gold); border-radius: 50%;
    animation: spin .8s linear infinite; display: none; z-index: 30; pointer-events: none; }
  #stage.busy #spin { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #rot { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 25; display: none;
    align-items: center; gap: .5rem; padding: .45rem .8rem; border-radius: 999px; font: inherit; font-size: .8rem;
    color: var(--ink); background: var(--panel); border: 1px solid var(--line); cursor: pointer; white-space: nowrap; }
  #rot.show { display: inline-flex; }
  #rot svg { width: 18px; height: 18px; fill: none; stroke: var(--gold); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* phone held sideways: use the whole screen for the two pages */
  body.compact header { display: none; }
  body.compact #bar { padding: .2rem .5rem .3rem; gap: .35rem; }
  body.compact .btn { height: 36px; min-width: 36px; }
  body.compact #toc { bottom: 52px; }
  #toc a.act { display: flex; width: 100%; align-items: center; gap: .7rem; padding: .6rem .7rem; border-radius: 12px;
    color: var(--ink); text-decoration: none; }
  #toc a.act:hover { background: rgba(217,182,96,.18); }
  #toc .sep { height: 1px; background: var(--line); margin: .4rem .3rem; }

  /* toolbar */
  #bar {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
    gap: .5rem; padding: .55rem .75rem .7rem; position: relative; z-index: 5;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
    height: 42px; min-width: 42px; padding: 0 .8rem;
    border: 1px solid var(--line); border-radius: 999px;
    background: rgba(255,255,255,.05); color: var(--ink);
    font: inherit; font-family: var(--font-en-medium); font-weight: 500; font-size: .85rem; cursor: pointer; text-decoration: none;
    transition: background .2s, border-color .2s, opacity .2s;
  }
  .btn:hover { background: rgba(217,182,96,.18); border-color: var(--gold); }
  .btn:disabled { opacity: .3; cursor: default; pointer-events: none; }
  .btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn.on { background: rgba(217,182,96,.25); border-color: var(--gold); }
  #indicator { min-width: 92px; direction: ltr; text-align: center; font-size: .95rem; font-family: var(--font-en-medium); font-weight: 300; font-variant-numeric: tabular-nums; }
  .spacer { width: .4rem; }

  /* table of contents */
  #toc {
    position: absolute; bottom: 70px; right: .75rem; z-index: 20;
    width: min(320px, calc(100vw - 1.5rem)); max-height: min(70vh, 480px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    padding: .5rem; display: none;
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  #toc.open { display: block; }
  #toc button {
    display: flex; width: 100%; align-items: center; gap: .7rem; text-align: right;
    padding: .6rem .7rem; border: 0; border-radius: 12px; background: transparent;
    color: var(--ink); font: inherit; cursor: pointer;
  }
  #toc button:hover, #toc button.active { background: rgba(217,182,96,.18); }
  #toc .num { color: var(--gold); font-family: var(--font-en-medium); font-weight: 500; min-width: 1.8rem; direction: ltr; text-align: center; }
  #toc .t { display: flex; flex-direction: column; line-height: 1.35; }
  #toc .t small { opacity: .6; direction: ltr; text-align: right; font-family: var(--font-en-medium); font-weight: 300; }
  #toc .pg { margin-right: auto; margin-left: 0; opacity: .55; font-size: .8rem; font-family: var(--font-en-medium); font-weight: 300; }

  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink); padding: .65rem 1rem; border-radius: 14px;
    font-size: .85rem; max-width: min(92vw, 380px); text-align: center; pointer-events: none; z-index: 60;
    transition: opacity .25s, transform .25s; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  noscript { position: absolute; inset: 0; display: grid; place-items: center; z-index: 50; background: var(--navy); }
  noscript a { color: var(--gold); }

  @media (max-width: 560px) {
    .btn .lbl { display: none; }
    #btnFull { display: none; }
    .btn { padding: 0 .65rem; }
    #bar { gap: .35rem; }
    #indicator { min-width: 70px; font-size: .9rem; }
    header { height: 38px; font-size: .85rem; }
  }
  body.desk .leaf { will-change: transform; }

  /* phones & tablets: much smaller shadow around the pages */
  @media (pointer: coarse) {
    .face { box-shadow: 0 0 2px rgba(0,0,0,.3); }
    .sp { box-shadow: 0 0 4px rgba(0,0,0,.28); }
    .face.front::after { background: linear-gradient(to left, rgba(0,0,0,.18), rgba(0,0,0,0) 4%); }
    .face.back::after  { background: linear-gradient(to right, rgba(0,0,0,.18), rgba(0,0,0,0) 4%); }
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --flip: .01s; }
    #zoom { transition: none; }
  }
</style>

<body>

<header><span><b>Mahfam</b> Company Profile</span></header>

<div id="stage" aria-label="کاتالوگ تعاملی">
  <div id="zoom"><div id="book"></div></div>
  <div id="spin"></div>
  <button id="rot" type="button" aria-label="چرخاندن گوشی"><svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 4v4h-4M20 15a8 8 0 0 1-14 3l-2-2M4 20v-4h4"/></svg><span>برای نمایش بزرگ‌تر، گوشی را بچرخانید</span></button>
</div>

<nav id="bar" aria-label="ابزار کاتالوگ">

<script>
(function () {
  "use strict";

  /* ---------- settings ---------- */
  var TOTAL = 42;                         // number of pages in the PDF
  var FILE = function (n) { return "pages/p-" + (n < 10 ? "0" + n : n) + ".jpg"; };
  var TOC = [
    [8,  "فهرست مطالب", "Table of Contents", ""],
    [10, "داستان ما", "Our Story", ""],
    [12, "درباره شرکت مهفام", "About Mahfam Company", "01"],
    [14, "خط مشی", "Politics", "02"],
    [16, "هویت بصری و طراحی گرافیک", "Graphic Design", "03"],
    [18, "عکاسی", "Photography", "04"],
    [20, "فیلم‌برداری و تولید ویدئو", "Film & Video", "05"],
    [22, "تدوین و پس‌تولید", "Post-Production", "06"],
    [24, "تبلیغات و تولید محتوا", "Creative Content", "07"],
    [26, "پروژه‌ها و نمونه‌کارها", "Selected Works", "08"],
    [28, "فرآیند همکاری", "Our Process", "09"],
    [30, "مشتریان و همکاری‌ها", "Our Clients", "10"],
    [40, "تماس با ما", "Contact", ""]
  ];

  /* ---------- elements ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), zoomEl = $("zoom"), book = $("book"), toc = $("toc");
  var rot = $("rot"), btnPrev = $("btnPrev"), btnNext = $("btnNext"), btnZoom = $("btnZoom"),
      btnFull = $("btnFull"), btnToc = $("btnToc"), indicator = $("indicator");

  var fa = function (n) { return Number(n).toLocaleString("fa-IR", { useGrouping: false }); };

  /* ---------- state ---------- */
  var VIEW = "spread";    // "spread" = two pages side by side like a real catalogue (default), "single" = one page
  try { if (localStorage.getItem("mahfam_view") === "single") VIEW = "single"; } catch (e) {}
  var DESK = !!(window.matchMedia && matchMedia("(hover: hover) and (pointer: fine)").matches);   // mouse + keyboard computers only
  if (DESK) document.body.classList.add("desk");
  var single = false;
  var cur = 0;            // number of leaves already flipped
  var leaves = [];        // leaf elements (desktop)
  var built = false;
  var P = 400;            // page side in px
  var zoom = 1, panX = 0, panY = 0;

  function leafCount() { return single ? TOTAL : TOTAL / 2; }
  function maxCur()    { return single ? TOTAL - 1 : TOTAL / 2; }

  /* page numbers shown for a given state c, 1-based */
  function pagesFor(c) {
    if (single) return [c + 1];
    if (c === 0) return [1];
    if (c === TOTAL / 2) return [TOTAL];
    return [2 * c, 2 * c + 1];
  }
  function visiblePages() { return pagesFor(cur); }

  /* ---------- build ---------- */
  var EXT = "webp";
  var AVIF_PROBE = "data:image/avif;base64,AAAAIGZ0eXBhdmlmAAAAAGF2aWZtaWYxbWlhZk1BMUIAAADrbWV0YQAAAAAAAAAhaGRscgAAAAAAAAAAcGljdAAAAAAAAAAAAAAAAAAAAAAOcGl0bQAAAAAAAQAAAB5pbG9jAAAAAEQAAAEAAQAAAAEAAAETAAAAGAAAAChpaW5mAAAAAAABAAAAGmluZmUCAAAAAAEAAGF2MDFDb2xvcgAAAABqaXBycAAAAEtpcGNvAAAAFGlzcGUAAAAAAAAAAgAAAAIAAAAQcGl4aQAAAAADCAgIAAAADGF2MUOBAAwAAAAAE2NvbHJuY2x4AAEADQAGgAAAABdpcG1hAAAAAAAAAAEAAQQBAoMEAAAAIG1kYXQSAAoFGAA2BCAyDRsAGmmmhAAAsBNWXIw=";
  var SMALL = function (n) { return "pages-42/p-" + (n < 10 ? "0" + n : n) + "." + EXT; };   // sharp 1200 px pages
  var CACHE_NAME = "mahfam-v5";                      // keep identical to the name in sw.js
  var blobOf = {}, jobs = {}, fgActive = 0;
  var MIME = { avif: "image/avif", webp: "image/webp", jpg: "image/jpeg" };
  function mimeOf(u) { return MIME[(u.split(".").pop() || "").toLowerCase()] || "application/octet-stream"; }

  /* Robust download for slow / unstable connections:
     - a connection that stops sending data for a few seconds is cancelled and the download RESUMES
       from the bytes already received (HTTP Range) instead of waiting forever
     - up to 8 attempts with a short pause between them
     - files already saved on the device are used without any network */
  function fetchBlob(url, fg, cb) {
    if (blobOf[url]) { cb(true); return; }
    var job = jobs[url];
    if (job) {
      job.cbs.push(cb);
      if (fg && !job.fg) { job.fg = true; fgActive++; yieldToForeground(); }
      return;
    }
    job = jobs[url] = { cbs: [cb], fg: !!fg, done: false, ctl: null, yielded: false };
    if (job.fg) { fgActive++; yieldToForeground(); }
    var chunks = [], got = 0, attempt = 0;

    function finish(ok, blob, fromCache) {
      if (job.done) return;
      job.done = true;
      var cbs = job.cbs;
      delete jobs[url];
      if (job.fg) fgActive--;
      if (ok) {
        blobOf[url] = URL.createObjectURL(blob);
        if (!fromCache && "caches" in window) {
          caches.open(CACHE_NAME).then(function (c) {
            return c.put(url, new Response(blob, { headers: { "Content-Type": mimeOf(url) } }));
          }).catch(function () {});
        }
        refreshImages();
      }
      cbs.forEach(function (f) { try { f(ok); } catch (e) {} });
      setTimeout(pump, 20);
    }

    function attemptOnce() {
      if (job.done) return;
      attempt++;
      var ctl = new AbortController(), timer = null, failed = false;
      job.ctl = ctl;
      function arm(ms) { clearTimeout(timer); timer = setTimeout(retry, ms); }
      function retry() {
        if (failed || job.done) return;
        failed = true; clearTimeout(timer);
        try { ctl.abort(); } catch (e) {}
        if (job.yielded) {                                  // paused for a page the reader is waiting for
          job.yielded = false; attempt--;
          (function wait() { if (fgActive > 0) setTimeout(wait, 500); else attemptOnce(); })();
          return;
        }
        if (attempt >= 8) { finish(false); return; }
        setTimeout(attemptOnce, Math.min(400 * attempt, 2500));
      }
      arm(9000);                                            // waiting for the first byte
      var headers = got > 0 ? { Range: "bytes=" + got + "-" } : {};
      fetch(url, { signal: ctl.signal, headers: headers }).then(function (res) {
        if (res.status === 416 && got > 0) { clearTimeout(timer); finish(true, new Blob(chunks, { type: mimeOf(url) })); return; }
        if (res.status !== 200 && res.status !== 206) throw new Error("status " + res.status);
        if (res.status === 200 && got > 0) { chunks = []; got = 0; }       // server ignored Range: start over
        if (!res.body || !res.body.getReader) {
          return res.blob().then(function (b) { clearTimeout(timer); finish(true, b); });
        }
        var reader = res.body.getReader();
        function pull() {
          arm(4500);                                        // no data for 4.5 s = stalled -> cancel and resume
          return reader.read().then(function (r) {
            if (r.done) { clearTimeout(timer); finish(true, new Blob(chunks, { type: mimeOf(url) })); return; }
            chunks.push(r.value); got += r.value.length;
            return pull();
          });
        }
        return pull();
      }).catch(retry);
    }

    var started = false;
    function go() { if (!started) { started = true; attemptOnce(); } }
    if ("caches" in window) {
      caches.open(CACHE_NAME).then(function (c) { return c.match(url); }).then(function (hit) {
        if (hit) return hit.blob().then(function (b) { started = true; finish(true, b, true); });
        go();
      }).catch(go);
    } else go();
  }

  /* when a reader is waiting for a page, pause background downloads so it gets the whole line */
  function yieldToForeground() {
    if (DESK) return;                              // plenty of bandwidth on a PC: do not pause background loading
    Object.keys(jobs).forEach(function (u) {
      var j = jobs[u];
      if (!j.fg && j.ctl) { j.yielded = true; try { j.ctl.abort(); } catch (e) {} }
    });
  }

  function loadPage(n, cb, fg) {
    fetchBlob(SMALL(n), fg, function (ok) {
      if (!ok || !fg) { cb(ok); return; }
      var im = new Image();                                  // decode before showing -> appears instantly
      im.src = blobOf[SMALL(n)];
      (im.decode ? im.decode() : Promise.resolve()).then(function () { cb(true); }, function () { cb(true); });
    });
  }
  function isReady(n) { return !!blobOf[SMALL(n)]; }
  function setImgSrc(img, page) {
    var b = blobOf[SMALL(page)];
    if (b && img.getAttribute("src") !== b) img.src = b;
  }
  /* give nearby pages their image, free far-away ones (keeps phone memory low) */
  function refreshImages() {
    if (single) {
      Object.keys(spEls).forEach(function (k) { setImgSrc(spEls[k].firstChild, +k + 1); });
      return;
    }
    var v = visiblePages(), lo = v[0] - (DESK ? 4 : 2), hi = v[v.length - 1] + (DESK ? 5 : 3);
    var imgs = book.querySelectorAll("img");
    for (var i = 0; i < imgs.length; i++) {
      var pg = +imgs[i].dataset.page;
      if (pg >= lo && pg <= hi) {
        setImgSrc(imgs[i], pg);
        if (DESK && imgs[i].decode && imgs[i].getAttribute("src") && !imgs[i]._d) {    // decode ahead: flips never stutter
          imgs[i]._d = 1; imgs[i].decode().catch(function () {});
        }
      } else if ((pg < lo - 3 || pg > hi + 3) && imgs[i].getAttribute("src")) { imgs[i].removeAttribute("src"); imgs[i]._d = 0; }
    }
  }
  var spinTimer = null;
  function showSpin(now) { clearTimeout(spinTimer); spinTimer = setTimeout(function () { stage.classList.add("busy"); }, now ? 0 : 150); }
  function hideSpin() { clearTimeout(spinTimer); stage.classList.remove("busy"); }

  function makeFace(cls, page) {
    var d = document.createElement("div");
    d.className = "face " + cls + (page ? "" : " blank");
    if (page) {
      var img = document.createElement("img");
      img.alt = "صفحه " + fa(page);
      img.decoding = "async";
      img.draggable = false;
      img.dataset.page = page;
      d.appendChild(img);
    }
    return d;
  }

  function build() {
    book.innerHTML = "";
    leaves = [];
    spEls = {};
    if (single) return;                      // phone mode mounts pages on demand
    for (var i = 0; i < TOTAL / 2; i++) {
      var leaf = document.createElement("div");
      leaf.className = "leaf";
      leaf.appendChild(makeFace("front", 2 * i + 1));
      leaf.appendChild(makeFace("back", 2 * i + 2));
      book.appendChild(leaf);
      leaves.push(leaf);
    }
  }

  /* ---------- layout ---------- */
  function updateRotateHint() {
    var show = !single && window.innerWidth < 600 && window.innerHeight > window.innerWidth;
    try { if (sessionStorage.getItem("mahfam_rot") === "1") show = false; } catch (e) {}
    rot.classList.toggle("show", show);
  }
  function layout() {
    document.body.classList.toggle("compact", window.innerHeight < 520 && window.innerWidth > window.innerHeight);
    var r = stage.getBoundingClientRect();
    var w = r.width, h = r.height;
    var wantSingle = (VIEW === "single");
    if (wantSingle !== single || !built) {
      var vis = built ? visiblePages()[0] : 1;
      single = wantSingle;
      built = true;
      document.body.classList.toggle("single", single);
      cur = single ? vis - 1 : Math.floor(vis / 2);
      prevCur = null;
      build();
      applyState(true);
      if (typeof startPrefetch === "function") startPrefetch();
    }
    P = Math.floor(single ? Math.min(w * 0.98, h * 0.97) : Math.min(w / 2 * 0.97, h * 0.97));
    book.style.setProperty("--p", P + "px");
    book.style.width = (single ? P : P * 2) + "px";
    book.style.height = P + "px";
    positionBook();
    clampPan(); applyZoom(true);
    updateRotateHint();
  }

  function positionBook() {
    var bw = single ? P : P * 2;
    var shift = 0;
    if (!single) {
      if (cur === 0) shift = P / 2;                  // closed cover sits on the left half: centre it
      else if (cur === TOTAL / 2) shift = -P / 2;    // back cover sits on the right half
    }
    book.style.transform = "translate(" + (-bw / 2 + shift) + "px," + (-P / 2) + "px)";
  }

  /* ---------- state -> DOM ---------- */
  var prevCur = null, zTimer = null;

  function applyState(instant) {
    if (single) applySingle(instant); else applyDouble(instant);
    prevCur = cur;
    positionBook();
    updateUI();
    if (started) pump();
  }

  /* desktop / tablet: 3D book */
  function applyDouble(instant) {
    var n = leaves.length;
    var from = prevCur === null ? cur : prevCur;
    var lo = Math.min(from, cur), hi = Math.max(from, cur);
    var forward = cur >= from;
    var k = 0;
    for (var j = 0; j < n; j++) {
      var i = forward ? j : n - 1 - j;
      var el = leaves[i];
      var flipped = i < cur;
      var moving = !instant && i >= lo && i < hi;
      el.style.transitionDelay = moving ? Math.min(k * 70, 420) + "ms" : "0ms";
      if (instant) el.style.transition = "none";
      el.classList.toggle("flipped", flipped);
      el.style.zIndex = moving ? 100 + k : (flipped ? i + 1 : n - i);
      if (moving) k++;
    }
    if (instant) { void book.offsetWidth; leaves.forEach(function (el) { el.style.transition = ""; }); }
    clearTimeout(zTimer);
    zTimer = setTimeout(function () {
      leaves.forEach(function (el, i) { el.style.zIndex = (i < cur) ? i + 1 : leaves.length - i; });
    }, instant ? 0 : 1500);
    refreshImages();
  }

  /* phone: only ~5 flat pages exist at any time */
  var spEls = {};
  function mountSingle(i, instant) {
    var el = spEls[i];
    if (el) return el;
    el = document.createElement("div");
    el.className = "sp " + (i < cur ? "gone" : "now") + (instant ? " instant" : "");
    var img = document.createElement("img");
    img.alt = "صفحه " + fa(i + 1);
    img.decoding = "async";
    img.draggable = false;
    img.dataset.page = i + 1;
    img.onload = function () { img.classList.add("ok"); };
    el.appendChild(img);
    book.appendChild(el);
    spEls[i] = el;
    return el;
  }
  function applySingle(instant) {
    var lo = Math.max(0, cur - 2), hi = Math.min(TOTAL - 1, cur + 3);
    Object.keys(spEls).forEach(function (k) {
      if (k < lo || k > hi) { var im = spEls[k].firstChild; im.removeAttribute("src"); spEls[k].remove(); delete spEls[k]; }
    });
    for (var i = lo; i <= hi; i++) {
      var el = mountSingle(i, true);
      var img = el.firstChild;
      setImgSrc(img, i + 1);
      if (instant || el.classList.contains("instant")) el.classList.add("instant");
      el.classList.toggle("gone", i < cur);
      el.classList.toggle("now", i >= cur);
      el.style.zIndex = i < cur ? i + 1 : TOTAL - i;
    }
    if (!instant) {
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        Object.keys(spEls).forEach(function (k) { spEls[k].classList.remove("instant"); });
      }); });
    } else {
      setTimeout(function () { Object.keys(spEls).forEach(function (k) { spEls[k].classList.remove("instant"); }); }, 60);
    }
  }

  function updateUI() {
    var v = visiblePages();
    indicator.textContent = v.length === 2
      ? v[0] + "–" + v[1] + " / " + TOTAL
      : v[0] + " / " + TOTAL;
    btnPrev.disabled = cur <= 0;
    btnNext.disabled = cur >= maxCur();
    var cp = v[0], maxV = v[v.length - 1];
    Array.prototype.forEach.call(toc.querySelectorAll("button[data-page]"), function (b) {
      var p = +b.dataset.page, next = null;
      for (var i = 0; i < TOC.length; i++) { if (TOC[i][0] > p) { next = TOC[i][0]; break; } }
      b.classList.toggle("active", maxV >= p && (next === null || cp < next));
    });
  }

  /* ---------- navigation ---------- */
  var navToken = 0;
  function commit(c) {
    var jump = Math.abs(c - cur) > 1 && single;
    cur = c;
    applyState(jump);
  }
  function setCur(c) {
    c = Math.max(0, Math.min(maxCur(), c));
    var token = ++navToken;
    if (c === cur) { hideSpin(); return; }
    var need = pagesFor(c).filter(function (n) { return !isReady(n); });
    if (need.length) {                         // never show a half-loaded page: wait for all of them
      showSpin(false);
      (function tryLoad() {
        var left = need.length, bad = false;
        need.forEach(function (n) {
          loadPage(n, function (ok) {
            if (token !== navToken) return;
            if (!ok) bad = true;
            if (--left > 0) return;
            if (bad) {
              toast("اتصال ضعیف است؛ دوباره تلاش می‌کنیم…");
              need = need.filter(function (m) { return !isReady(m); });
              tryLoad(); return;
            }
            hideSpin(); commit(c);
          }, true);
        });
      })();
      return;
    }
    hideSpin();
    commit(c);
  }
  function next() { setCur(cur + 1); }
  function prev() { setCur(cur - 1); }
  function goTo(page) {
    page = Math.max(1, Math.min(TOTAL, page));
    setCur(single ? page - 1 : Math.floor(page / 2));
  }

  /* ---------- zoom / pan ---------- */
  function clampPan() {
    var r = stage.getBoundingClientRect();
    var mx = Math.max(0, (zoom - 1) * r.width / 2), my = Math.max(0, (zoom - 1) * r.height / 2);
    panX = Math.max(-mx, Math.min(mx, panX));
    panY = Math.max(-my, Math.min(my, panY));
  }
  function applyZoom(noAnim) {
    zoomEl.classList.toggle("nodrag", !!noAnim);
    zoomEl.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + zoom + ")";
    stage.classList.toggle("zoomed", zoom > 1);
    btnZoom.classList.toggle("on", zoom > 1);
  }
  function toggleZoom() {
    zoom = zoom > 1 ? 1 : 2;
    panX = panY = 0;
    applyZoom(false);
  }

  /* ---------- pointer: tap, swipe, pan ---------- */
  var down = null;
  stage.addEventListener("pointerdown", function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    down = { x: e.clientX, y: e.clientY, px: panX, py: panY, moved: false };
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  });
  stage.addEventListener("pointermove", function (e) {
    if (!down) return;
    var dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) down.moved = true;
    if (zoom > 1 && down.moved) {
      stage.classList.add("dragging");
      panX = down.px + dx; panY = down.py + dy;
      clampPan(); applyZoom(true);
    }
  });
  function endPointer(e) {
    if (!down) return;
    var d = down; down = null;
    stage.classList.remove("dragging");
    if (zoom > 1) return;
    var dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      dx > 0 ? next() : prev();                 // RTL: drag to the right = next page
    } else if (!d.moved) {
      var r = stage.getBoundingClientRect();
      (e.clientX - r.left) < r.width / 2 ? next() : prev();   // left half = next, right half = back
    }
  }
  stage.addEventListener("pointerup", endPointer);
  stage.addEventListener("pointercancel", function () { down = null; stage.classList.remove("dragging"); });

  /* ---------- buttons, keyboard ---------- */
  btnNext.addEventListener("click", next);
  btnPrev.addEventListener("click", prev);
  btnZoom.addEventListener("click", toggleZoom);
  if (document.documentElement.requestFullscreen) {
    btnFull.addEventListener("click", function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    });
  } else { btnFull.style.display = "none"; }

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft")  { e.preventDefault(); next(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); prev(); }
    else if (e.key === "Home") { goTo(1); }
    else if (e.key === "End")  { goTo(TOTAL); }
    else if (e.key === "Escape") { toc.classList.remove("open"); }
    else if (e.key === "+" || e.key === "=" || e.key === "-") { toggleZoom(); }
  });

  /* ---------- table of contents ---------- */
  TOC.forEach(function (it) {
    var b = document.createElement("button");
    b.dataset.page = it[0];
    b.innerHTML = '<span class="num">' + (it[3] || "•") + '</span>' +
                  '<span class="t">' + it[1] + '<small>' + it[2] + '</small></span>' +
                  '<span class="pg">' + it[0] + '</span>';
    b.addEventListener("click", function () { goTo(it[0]); toc.classList.remove("open"); btnToc.classList.remove("on"); });
    toc.appendChild(b);
  });
  var sepEl = document.createElement("div"); sepEl.className = "sep"; toc.appendChild(sepEl);
  var bView = document.createElement("button");
  function viewLabel() { bView.innerHTML = '<span class="num">▭</span><span class="t">' + (VIEW === "single" ? "نمایش دوصفحه‌ای (مثل کاتالوگ)" : "نمایش تک‌صفحه‌ای") + '</span>'; }
  viewLabel();
  bView.addEventListener("click", function () {
    VIEW = VIEW === "single" ? "spread" : "single";
    try { localStorage.setItem("mahfam_view", VIEW); } catch (e) {}
    viewLabel(); toc.classList.remove("open"); btnToc.classList.remove("on");
    layout();
  });
  toc.appendChild(bView);
  rot.addEventListener("click", function () {
    try { sessionStorage.setItem("mahfam_rot", "1"); } catch (e) {}
    rot.classList.remove("show");
  });
  btnToc.addEventListener("click", function (e) {
    e.stopPropagation();
    var open = toc.classList.toggle("open");
    btnToc.classList.toggle("on", open);
  });
  document.addEventListener("click", function (e) {
    if (!toc.contains(e.target) && e.target !== btnToc && !btnToc.contains(e.target)) {
      toc.classList.remove("open"); btnToc.classList.remove("on");
    }
  });

  /* ---------- start ---------- */
  var rt;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(layout, 120); });
  window.addEventListener("orientationchange", function () { setTimeout(layout, 250); });
  /* ---------- background prefetch: quietly download the rest on phones ---------- */
  var fetched = {}, bgActive = 0, started = false;
  function pump() {
    if (!started) return;
    var maxBg = DESK ? 4 : 1;                                   // PC: 4 quiet downloads in parallel, phone: 1
    var c = navigator.connection;
    if (c && c.saveData) return;                                // respect data saver
    while (bgActive < maxBg && (DESK || fgActive === 0)) {
      var best = 0, bd = 1e9, i, vp = visiblePages(), vmin = vp[0], vmax = vp[vp.length - 1];
      for (i = 1; i <= TOTAL; i++) {
        if (fetched[i] || blobOf[SMALL(i)]) continue;
        var d = i > vmax ? i - vmax : (i >= vmin ? 0 : (vmin - i) * 3);   // pages ahead first
        if (d < bd) { bd = d; best = i; }
      }
      if (!best) return;
      var n = best;
      fetched[n] = 1; bgActive++;
      fetchBlob(SMALL(n), false, function (ok) {
        bgActive--;
        if (!ok) setTimeout(function () { fetched[n] = 0; pump(); }, 8000);
      });
    }
  }
  function startPrefetch() {
    if (started) return; started = true;
    var go = function () { pump(); };
    if (DESK) go();                                             // PC: start right away
    else if (window.requestIdleCallback) requestIdleCallback(go, { timeout: 1500 }); else setTimeout(go, 800);
  }

  /* ---------- small helpers ---------- */
  var toastEl = $("toast"), toastTimer;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 3200);
  }
  /* pages downloaded while reading are kept on the device (Cache API) and the service worker keeps the
     page itself, so a visited catalogue also opens without internet */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }

  function detectAvif(cb) {
    var t = new Image(), done = false;
    var fin = function (ok) { if (!done) { done = true; cb(ok); } };
    t.onload = function () { fin(t.width > 0); };
    t.onerror = function () { fin(false); };
    t.src = AVIF_PROBE;
    setTimeout(function () { fin(false); }, 400);
  }

  detectAvif(function (ok) {
    EXT = ok ? "avif" : "webp";
    showSpin(true);                              // show the cover only when it is fully loaded
    (function first() {
      loadPage(1, function (ok) {
        if (!ok) { toast("اتصال ضعیف است؛ دوباره تلاش می‌کنیم…"); first(); return; }
        hideSpin(); layout(); startPrefetch();
      }, true);
    })();
  });
})();
</script>
</body>
</html>
